name: release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: set up rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-rust-release
          cache-targets: true

      - name: run tests
        run: cargo test

      - name: doc build
        env:
          RUSTDOCFLAGS: "--cfg docsrs"
        run: cargo doc --no-deps

      - name: install sbom tools
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-cyclonedx

      - name: generate sbom
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          (cd /tmp && cargo cyclonedx --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
            --format json \
            --override-filename "sbom-${REF_NAME}.cdx" \
            --all-features)

      - name: collect sbom files
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/contextual-encoder-sbom
          find /tmp -maxdepth 1 -type f -name "sbom-${REF_NAME}.cdx.json" \
            -exec mv {} /tmp/contextual-encoder-sbom/ \;
          find "$GITHUB_WORKSPACE" -type f -name "sbom-${REF_NAME}.cdx.json" \
            -exec mv {} /tmp/contextual-encoder-sbom/ \;

      - name: upload sbom
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.ref_name }}
          path: "/tmp/contextual-encoder-sbom/sbom-${{ github.ref_name }}.cdx.json"
          if-no-files-found: error

      - name: attach sbom to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: /tmp/contextual-encoder-sbom/sbom-${{ github.ref_name }}.cdx.json

      - name: publish to crates.io
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
